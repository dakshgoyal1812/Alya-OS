<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Alya — Your private, local AI assistant with voice capabilities">
  <title>✨ Alya — Your Local AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated background -->
  <div class="bg-ocean">
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
  </div>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-container">
          <img src="alya.png" alt="Alya" class="logo-img" id="logo-img">
          <div class="logo-glow"></div>
        </div>
        <h1 class="logo-text">Alya</h1>
        <p class="logo-subtitle">Your Local AI Assistant</p>
      </div>

      <div class="status-section">
        <h3 class="section-title">System Status</h3>
        <div class="status-grid">
          <div class="status-item" id="status-groq">
            <span class="status-dot"></span>
            <span class="status-label">🧠 Groq API</span>
            <span class="status-value">Checking...</span>
          </div>
          <div class="status-item" id="status-model">
            <span class="status-dot"></span>
            <span class="status-label">🤖 Model</span>
            <span class="status-value">—</span>
          </div>
        </div>
      </div>

      <div class="bridges-section">
        <h3 class="section-title">Connected Bridges</h3>
        <div class="bridge-list" id="bridge-list">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="btn-clear" id="btn-clear" title="Clear conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear Chat
        </button>
        <div class="privacy-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          100% Private & Local
        </div>
      </div>
    </aside>

    <!-- Mobile sidebar toggle -->
    <button class="sidebar-toggle" id="sidebar-toggle">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <!-- Main Chat Area -->
    <main class="chat-main">
      <div class="chat-header">
        <div class="chat-header-info">
          <span class="chat-emoji">✨</span>
          <div>
            <h2>Chat with Alya</h2>
            <span class="chat-header-status" id="connection-status">Connecting...</span>
          </div>
        </div>
      </div>

      <div class="messages-container" id="messages">
        <!-- Welcome screen -->
        <div class="welcome-screen" id="welcome-screen">
          <div class="welcome-icon">✨</div>
          <h2>Hey. I'm Alya.</h2>
          <p>Your private AI assistant, running right here on your device.</p>
          <p class="welcome-hint">Type a message or tap the mic to start talking.</p>
          <div class="feature-chips">
            <button class="chip" data-prompt="What can you help me with?">💡 What can you do?</button>
            <button class="chip" data-prompt="Tell me something interesting">✨ Fun facts</button>
            <button class="chip" data-prompt="Help me write a creative story">✍️ Write a story</button>
            <button class="chip" data-prompt="Explain quantum computing simply">🔬 Explain science</button>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="message-input" placeholder="Message Alya..." rows="1" autofocus></textarea>
          <div class="input-actions">
            <button class="btn-voice" id="btn-voice" title="Voice input">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              <div class="voice-pulse"></div>
            </button>
            <button class="btn-send" id="btn-send" title="Send message">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
        <div class="voice-indicator" id="voice-indicator">
          <div class="voice-bars">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <span class="voice-text">Listening...</span>
          <button class="voice-stop" id="voice-stop">Stop</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
